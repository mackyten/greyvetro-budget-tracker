<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greyvetro</title>
<style>
  :root {
    --bg: #EEF1F5;
    --text: #14181F;
    --muted: #55606E;
    --accent: #3E9AC4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151A; --text: #ECEFF3; --muted: #9AA5B1; --accent: #63B7DA; }
  }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .center { text-align: center; padding: 24px; }
  .mark {
    width: 40px; height: 40px; border-radius: 11px;
    background: var(--accent); margin: 0 auto 18px;
  }
  h1 { margin: 0 0 6px; font-size: 1.4rem; letter-spacing: -0.01em; }
  p { color: var(--muted); margin: 0; }
  a { color: var(--accent); }
</style>
</head>
<body>
  <div class="center">
    <div class="mark"></div>
    <h1>Greyvetro</h1>
    <p><a href="/privacy">Privacy Policy</a></p>
  </div>
</body>
</html>
